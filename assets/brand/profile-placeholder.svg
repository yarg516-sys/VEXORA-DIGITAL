<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="vMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="450" rx="20" fill="url(#avatarBg)" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Subtle circular grid -->
  <circle cx="200" cy="200" r="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.4" />
  <circle cx="200" cy="200" r="100" stroke="#2563eb" stroke-width="1" stroke-dasharray="2,4" stroke-opacity="0.3" />

  <!-- Abstract Creative Professional Silhouette -->
  <g transform="translate(130, 90)">
    <!-- Head -->
    <circle cx="70" cy="55" r="42" fill="#cbd5e1" />
    <circle cx="70" cy="55" r="38" fill="#e2e8f0" />
    <!-- Vexora Headset / Creative Goggles Stylized -->
    <path d="M40 50 C40 30 100 30 100 50" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none" />
    <rect x="36" y="44" width="8" height="14" rx="4" fill="#2563eb" />
    <rect x="96" y="44" width="8" height="14" rx="4" fill="#2563eb" />
    <!-- Torso -->
    <path d="M15 170 C15 125 45 110 70 110 C95 110 125 125 125 170 Z" fill="#94a3b8" />
    <path d="M22 170 C22 132 48 118 70 118 C92 118 118 132 118 170 Z" fill="#cbd5e1" />
  </g>

  <!-- Glowing V Brand Badge on Chest -->
  <g transform="translate(182, 230)">
    <circle cx="18" cy="18" r="18" fill="#ffffff" filter="url(#avatarGlow)" />
    <polygon points="10,12 26,12 18,25" fill="url(#vMarkGrad)" />
  </g>

  <!-- Photo Placeholder Tag -->
  <g transform="translate(80, 345)">
    <rect width="240" height="42" rx="21" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    <circle cx="24" cy="21" r="12" fill="#eff6ff" />
    <path d="M20 21 L28 21 M24 17 L24 25" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <text x="44" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">REPLACE WITH YOUR PHOTO</text>
    <text x="44" y="31" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Editable in js/config.js or HTML</text>
  </g>
</svg>