<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <linearGradient id="vexoraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="vexoraGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.9" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abstract V Mark -->
  <g transform="translate(10, 10)">
    <!-- Left Wing (Deep Blue Facet) -->
    <path d="M12 10 L38 10 L50 48 L32 78 Z" fill="url(#vexoraGrad1)" />
    
    <!-- Right Wing (Cyan-Blue Digital Accent) -->
    <path d="M68 10 L42 10 L32 78 L46 78 Z" fill="url(#vexoraGrad2)" />
    
    <!-- Central Digital Apex / Core Gem -->
    <polygon points="40,24 50,48 40,70 30,48" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="40" cy="48" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    
    <!-- Floating Digital Sparkle / Node -->
    <circle cx="66" cy="18" r="3" fill="#06b6d4" />
    <line x1="58" y1="24" x2="66" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(105, 12)">
    <!-- VEXORA -->
    <text x="0" y="44" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="1.5" fill="#0f172a">
      VEXORA
    </text>
    <text x="162" y="44" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="400" font-size="34" letter-spacing="2" fill="#2563eb">
      DIGITAL
    </text>
    
    <!-- Tagline Divider & Subtext -->
    <line x1="0" y1="56" x2="295" y2="56" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="56" x2="60" y2="56" stroke="url(#accentGlow)" stroke-width="2" />
    <text x="0" y="74" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="3.2" fill="#64748b">
      AI CREATIVITY · DIGITAL EXCELLENCE
    </text>
  </g>
</svg>