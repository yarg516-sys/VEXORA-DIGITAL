    <polygon points="43,30 54,56 43,76 32,56" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="43" cy="56" r="4.5" fill="#38bdf8" filter="url(#markGlow)" />
    <!-- Floating Node -->
    <circle cx="70" cy="22" r="3.5" fill="#06b6d4" />
    <line x1="60" y1="28" x2="70" y2="22" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>
</svg>