<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" fill="none">
  <defs>
    <linearGradient id="heroCardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="heroDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="heroBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
    <filter id="floatShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient background glow behind visual composition -->
  <circle cx="400" cy="300" r="220" fill="#eff6ff" />
  <ellipse cx="480" cy="240" rx="160" ry="120" fill="#e0f2fe" fill-opacity="0.7" />

  <!-- Main Website Mockup Window (Center Layer) -->
  <g transform="translate(60, 50)" filter="url(#heroShadow)">
    <rect width="520" height="340" rx="14" fill="url(#heroCardGrad1)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Browser chrome -->
    <rect width="520" height="34" rx="14" fill="#f8fafc" />
    <path d="M0 24 L520 24 L520 34 L0 34 Z" fill="#f8fafc" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="17" r="4.5" fill="#10b981" />
    <!-- URL Pill -->
    <rect x="75" y="9" width="280" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="145" y="21" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">https://vexoradigital.studio/portfolio</text>

    <!-- Website Mockup Body -->
    <g transform="translate(24, 52)">
      <circle cx="10" cy="10" r="9" fill="url(#heroBlueGrad)" />
      <text x="26" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#0f172a">VEXORA<tspan fill="#2563eb"> STUDIO</tspan></text>
      <!-- Hero text mock -->
      <text x="0" y="46" font-family="'Inter', sans-serif" font-size="17" font-weight="900" fill="#0f172a">AI Video Creation &amp;</text>
      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="17" font-weight="900" fill="#2563eb">Modern Web Development</text>
      <text x="0" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Transforming visionary business concepts into high-converting digital assets.</text>
      
      <!-- Interactive Button Mock -->
      <rect x="0" y="98" width="86" height="24" rx="6" fill="#2563eb" />
      <text x="43" y="114" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Explore Work</text>

      <!-- Mock 2-col visual cards -->
      <rect x="0" y="136" width="130" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <rect x="8" y="144" width="114" height="42" rx="4" fill="#eff6ff" />
      <circle cx="65" cy="165" r="12" fill="#2563eb" fill-opacity="0.2" />
      <polygon points="62,159 70,165 62,171" fill="#2563eb" />
      <text x="8" y="200" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0f172a">Commercial Video</text>
      <text x="8" y="212" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">AI Generation 4K</text>

      <rect x="140" y="136" width="130" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <rect x="148" y="144" width="114" height="42" rx="4" fill="#f0fdf4" />
      <path d="M165 174 L185 156 L200 166 L225 150" stroke="#16a34a" stroke-width="2" fill="none" />
      <text x="148" y="200" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0f172a">Web Development</text>
      <text x="148" y="212" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Responsive &amp; Fast</text>
    </g>

    <!-- Right Graphic inside Browser: Device Wireframe -->
    <g transform="translate(330, 60)">
      <rect width="165" height="195" rx="10" fill="url(#heroDarkGrad)" />
      <!-- Waveform graphic -->
      <path d="M15 100 Q40 50 65 100 T115 100 T150 100" stroke="#38bdf8" stroke-width="2.5" fill="none" />
      <circle cx="82" cy="70" r="28" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="78,60 92,70 78,80" fill="#ffffff" />
      <rect x="15" y="140" width="135" height="12" rx="3" fill="#334155" />
      <rect x="15" y="140" width="75" height="12" rx="3" fill="url(#cyanBadge)" />
      <text x="15" y="172" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">AI Video Pipeline</text>
      <text x="15" y="184" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Active Render • 1080p 60fps</text>
    </g>
  </g>

  <!-- Floating Card 1: AI Video Showcase (Bottom Left Overlap) -->
  <g transform="translate(30, 360)" filter="url(#floatShadow)">
    <rect width="260" height="180" rx="12" fill="url(#heroDarkGrad)" stroke="#334155" />
    <g transform="translate(16, 14)">
      <!-- Badge -->
      <rect width="90" height="20" rx="10" fill="#2563eb" />
      <text x="45" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">🎬 AI VIDEO SUITE</text>
      
      <!-- Video Frame Preview -->
      <rect x="0" y="30" width="228" height="85" rx="6" fill="#020617" stroke="#1e293b" />
      <!-- Abstract cinematic glow -->
      <circle cx="114" cy="72" r="30" fill="#38bdf8" fill-opacity="0.25" />
      <circle cx="114" cy="72" r="18" fill="#2563eb" />
      <polygon points="110,65 122,72 110,79" fill="#ffffff" />
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#38bdf8">LUMINA BOTANICALS</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="125" width="228" height="4" rx="2" fill="#334155" />
      <rect x="0" y="125" width="140" height="4" rx="2" fill="#38bdf8" />
      
      <text x="0" y="146" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Promotional Commercial</text>
      <text x="0" y="157" font-family="'Inter', sans-serif" font-size="7.5" fill="#94a3b8">Cinematic Lighting &amp; Storytelling</text>
    </g>
  </g>

  <!-- Floating Card 2: AI Graphic Design & Social Ads (Bottom Right Overlap) -->
  <g transform="translate(420, 310)" filter="url(#floatShadow)">
    <rect width="290" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <g transform="translate(18, 16)">
      <!-- Header -->
      <rect width="115" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="57" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#059669">✨ AI GRAPHICS &amp; ADS</text>
      
      <!-- 2 Mini Post Mockups -->
      <g transform="translate(0, 32)">
        <rect width="118" height="110" rx="8" fill="#ea580c" />
        <circle cx="59" cy="45" r="24" fill="#ffffff" fill-opacity="0.2" />
        <text x="59" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff">SAVOR &amp; FIRE</text>
        <text x="59" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#fed7aa">Weekend 20% Off</text>
      </g>
      
      <g transform="translate(132, 32)">
        <rect width="118" height="110" rx="8" fill="#18181b" />
        <text x="59" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1">KROMA</text>
        <rect x="24" y="55" width="70" height="16" rx="8" fill="#2563eb" />
        <text x="59" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#ffffff">NEW CAPSULE</text>
        <text x="59" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6.5" fill="#a1a1aa">Autumn Drop '26</text>
      </g>

      <!-- Bottom Status -->
      <g transform="translate(0, 155)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0f172a">Cross-Platform Consistency</text>
        <text x="0" y="26" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748b">Coordinated for Instagram, TikTok &amp; Web</text>
        <rect x="180" y="4" width="70" height="20" rx="5" fill="#0f172a" />
        <text x="215" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#ffffff">5 Formats</text>
      </g>
    </g>
  </g>

  <!-- Floating Badge: Digital Excellence (Top Right) -->
  <g transform="translate(530, 20)" filter="url(#floatShadow)">
    <rect width="200" height="56" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    <circle cx="28" cy="28" r="16" fill="#eff6ff" />
    <path d="M22 28 L27 33 L35 23" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="52" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#0f172a">Vexora Quality</text>
    <text x="52" y="38" font-family="'Inter', sans-serif" font-size="8.5" fill="#2563eb" font-weight="600">AI Driven · Handcrafted</text>
  </g>
</svg>