<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="p5BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="fashionCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="fashionAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="p5Shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#p5BgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 22)">
    <rect width="180" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="16" cy="14" r="4" fill="#2563eb" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">CONCEPT AD SUITE</text>
  </g>
  <text x="770" y="40" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b">KROMA Studios • Coordinated Multi-Format Retail Ads</text>

  <!-- Format 1: 9:16 Mobile Story Format (Left) -->
  <g transform="translate(35, 65)" filter="url(#p5Shadow)">
    <rect width="180" height="325" rx="14" fill="url(#fashionCard1)" stroke="#3f3f46" />
    <!-- Story Progress Bars at Top -->
    <g transform="translate(14, 12)">
      <rect width="45" height="2.5" rx="1" fill="#ffffff" />
      <rect x="52" width="45" height="2.5" rx="1" fill="#ffffff" fill-opacity="0.3" />
      <rect x="104" width="45" height="2.5" rx="1" fill="#ffffff" fill-opacity="0.3" />
    </g>
    <!-- Brand -->
    <text x="14" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="2">KROMA</text>
    <text x="166" y="36" text-anchor="end" font-family="'Inter', sans-serif" font-size="8" fill="#a1a1aa">FALL '26</text>
    
    <!-- Visual Image Area (Minimalist Fashion Silhouette) -->
    <g transform="translate(14, 50)">
      <rect width="152" height="180" rx="8" fill="#27272a" />
      <path d="M40 180 L55 80 L76 70 L97 80 L112 180 Z" fill="#3f3f46" />
      <circle cx="76" cy="50" r="16" fill="#52525b" />
      <rect x="62" y="80" width="28" height="90" rx="3" fill="#18181b" />
      <!-- Overlay Tag -->
      <rect x="10" y="10" width="70" height="18" rx="9" fill="#0284c7" fill-opacity="0.9" />
      <text x="45" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">NEW DROP</text>
    </g>

    <!-- Typography -->
    <text x="14" y="254" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">MONOCHROME</text>
    <text x="14" y="270" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#06b6d4">COLLECTION.</text>
    <text x="14" y="286" font-family="'Inter', sans-serif" font-size="8" fill="#a1a1aa">Architectural tailoring for urban life.</text>

    <!-- Swipe Up Pill -->
    <g transform="translate(45, 300)">
      <rect width="90" height="18" rx="9" fill="#ffffff" />
      <text x="45" y="12" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#09090b">Shop Lookbook ↑</text>
    </g>
  </g>

  <!-- Format 2: 1:1 Square Feed Post (Center) -->
  <g transform="translate(240, 65)" filter="url(#p5Shadow)">
    <rect width="250" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0" />
    <!-- Header -->
    <g transform="translate(16, 16)">
      <circle cx="10" cy="10" r="10" fill="#0f172a" />
      <text x="26" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0f172a">kroma.official</text>
      <text x="26" y="19" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748b">Sponsored • Global</text>
      <text x="205" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#64748b">···</text>
    </g>

    <!-- Graphic Artwork -->
    <g transform="translate(16, 42)">
      <rect width="218" height="140" rx="8" fill="#f1f5f9" />
      <!-- Aesthetic Grid -->
      <line x1="30" y1="20" x2="30" y2="120" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <line x1="188" y1="20" x2="188" y2="120" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <text x="109" y="55" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="3">AUTUMN '26</text>
      <text x="109" y="75" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b">LIMITED CAPSULE SERIES</text>
      <!-- Discount Badge -->
      <rect x="74" y="90" width="70" height="22" rx="11" fill="url(#fashionAccent)" />
      <text x="109" y="104" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">CODE: KROMA30</text>
    </g>

    <!-- Post Action Footer -->
    <g transform="translate(16, 196)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0f172a">KROMA Autumn Editorial Drops Today</text>
      <text x="0" y="28" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">Free worldwide shipping on orders over $150.</text>
      <rect x="145" y="2" width="72" height="24" rx="6" fill="#0f172a" />
      <text x="181" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">Shop Now</text>
    </g>
  </g>

  <!-- Format 3: 16:9 Landscape Banner Ad (Top Right) -->
  <g transform="translate(515, 65)" filter="url(#p5Shadow)">
    <rect width="250" height="150" rx="12" fill="#0f172a" stroke="#334155" />
    <!-- Gradient Glow -->
    <circle cx="210" cy="40" r="50" fill="#2563eb" fill-opacity="0.2" />
    
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1.5">KROMA DIGITAL CAMPAIGN</text>
    <text x="20" y="60" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#ffffff">REDEFINE STYLE</text>
    <text x="20" y="80" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">The premier modern capsule tailored for creators.</text>
    
    <rect x="20" y="100" width="100" height="26" rx="6" fill="#2563eb" />
    <text x="70" y="116" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Discover Capsule &gt;</text>
  </g>

  <!-- Format 4: Story Carousel Slide (Bottom Center/Right) -->
  <g transform="translate(240, 330)" filter="url(#p5Shadow)">
    <rect width="525" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">BRAND ASSET UNIFORMITY</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Unified fonts, hex codes (#18181B / #0284C7 / #F8FAFC), and high-conversion layout templates.</text>
    <g transform="translate(390, 16)">
      <rect width="54" height="28" rx="4" fill="#f1f5f9" />
      <text x="27" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#334155">Story 9:16</text>
      <rect x="60" width="54" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="87" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#1e40af">Feed 1:1</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(35, 410)">
    <rect width="730" height="65" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <g transform="translate(20, 16)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">CAMPAIGN METRICS &amp; ASSETS</text>
      <text x="0" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Includes: 6 Meta Feed Ads, 4 Instagram Stories, 2 Google Display Banners, and 1 Brand Style Sheet.</text>
    </g>
    <g transform="translate(540, 18)">
      <rect width="76" height="28" rx="6" fill="#f1f5f9" />
      <text x="38" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#334155">Photoshop</text>
      <rect x="84" width="86" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="127" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#1d4ed8">Figma Suite</text>
    </g>
  </g>
</svg>