<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Info Header -->
  <g transform="translate(30, 22)">
    <rect width="180" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="16" cy="14" r="4" fill="#2563eb" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">CONCEPT AI PROMO</text>
  </g>
  <text x="770" y="40" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b">NovaPulse Smartband • Generative Tech Showcase</text>

  <!-- Video Main Showcase Canvas -->
  <g transform="translate(30, 65)">
    <rect width="520" height="320" rx="12" fill="url(#cyberBg)" />
    
    <!-- Background Tech Grid Lines -->
    <path d="M0 80 L520 80 M0 160 L520 160 M0 240 L520 240" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4" />
    <path d="M130 0 L130 320 M260 0 L260 320 M390 0 L390 320" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4" />

    <!-- Circular HUD Hologram Rings -->
    <circle cx="260" cy="150" r="110" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6,4" />
    <circle cx="260" cy="150" r="85" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="12,6" />
    <circle cx="260" cy="150" r="60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" filter="url(#aiGlow)" />

    <!-- Futuristic Device / Smart Ring-Band Render -->
    <g transform="translate(260, 150)">
      <!-- Band ring isometric -->
      <ellipse cx="0" cy="0" rx="46" ry="24" stroke="url(#neonCyan)" stroke-width="7" fill="none" filter="url(#aiGlow)" />
      <ellipse cx="0" cy="-6" rx="46" ry="24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
      <circle cx="-32" cy="-14" r="3" fill="#38bdf8" />
      <circle cx="32" cy="-14" r="3" fill="#38bdf8" />
      <!-- Core Crystal Node -->
      <circle cx="0" cy="0" r="9" fill="#0284c7" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Animated Audio / Biometric Waveforms -->
    <path d="M120 230 Q150 200 180 230 T240 230 T300 210 T360 230 T420 230" stroke="url(#pulseGlow)" stroke-width="2.5" fill="none" filter="url(#aiGlow)" />
    
    <!-- Top HUD Metadata -->
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">AI MODEL SYNTHESIS // RUNWAY GEN-3</text>
    <rect x="420" y="20" width="80" height="18" rx="4" fill="#1e293b" />
    <text x="460" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#06b6d4">FPS: 60 • 4K UHD</text>

    <!-- Center Play Icon -->
    <g transform="translate(260, 150)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="-4,-8 10,0 -4,8" fill="#ffffff" />
    </g>

    <!-- Video Scrub Bar -->
    <g transform="translate(20, 286)">
      <rect width="480" height="22" rx="4" fill="#000000" fill-opacity="0.75" />
      <polygon points="12,7 18,11 12,15" fill="#38bdf8" />
      <rect x="28" y="9" width="370" height="4" rx="2" fill="#1e293b" />
      <rect x="28" y="9" width="165" height="4" rx="2" fill="url(#neonCyan)" />
      <circle cx="193" cy="11" r="5" fill="#38bdf8" filter="url(#aiGlow)" />
      <text x="445" y="15" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#e2e8f0">0:14 / 0:45</text>
    </g>
  </g>

  <!-- Right Storyboard Beats -->
  <g transform="translate(570, 65)">
    <rect width="200" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f172a">PROMO BEATS</text>
    <text x="16" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">AI Video Generation Flow</text>

    <!-- Scene 1 -->
    <g transform="translate(14, 55)">
      <rect width="172" height="68" rx="6" fill="#030712" stroke="#0ea5e9" stroke-width="1" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#38bdf8">01. NEURAL GENESIS</text>
      <circle cx="86" cy="38" r="14" fill="#0284c7" fill-opacity="0.4" />
      <text x="10" y="58" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Particle physics assembly</text>
    </g>

    <!-- Scene 2 (Active) -->
    <g transform="translate(14, 134)">
      <rect width="172" height="68" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#818cf8">02. HUD BIOMETRICS (ACTIVE)</text>
      <ellipse cx="86" cy="36" rx="28" ry="12" stroke="#38bdf8" stroke-width="1.5" fill="none" />
      <text x="10" y="58" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Dynamic pulse synchronization</text>
    </g>

    <!-- Scene 3 -->
    <g transform="translate(14, 213)">
      <rect width="172" height="68" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
      <text x="10" y="16" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#cbd5e1">03. PRODUCT REVEAL &amp; CTA</text>
      <text x="86" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#38bdf8">NOVAPULSE</text>
      <text x="10" y="58" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8">Pre-order release timeline</text>
    </g>

    <text x="100" y="306" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">Explore Concept Storyboard &gt;</text>
  </g>

  <!-- Technical Specs Footer -->
  <g transform="translate(30, 405)">
    <rect width="740" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <g transform="translate(20, 18)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">GENERATIVE WORKFLOW</text>
      <text x="0" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">AI Tools: Midjourney v6 + Runway Gen-3 + Topaz Video AI • Sound: Synthesized Spatial SFX</text>
    </g>
    <g transform="translate(530, 20)">
      <rect width="90" height="28" rx="6" fill="#f1f5f9" />
      <text x="45" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155">Runway Gen-3</text>
      <rect x="98" width="90" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="143" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">Motion Design</text>
    </g>
  </g>
</svg>