<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="webShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#webBgGrad)" stroke="#cbd5e1" />

  <!-- Top Ribbon -->
  <g transform="translate(30, 22)">
    <rect width="180" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="16" cy="14" r="4" fill="#2563eb" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">CONCEPT WEBSITE</text>
  </g>
  <text x="770" y="40" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b">Apex Solutions • Responsive SaaS Landing Page</text>

  <!-- Desktop Browser Mockup (Left/Center) -->
  <g transform="translate(30, 65)" filter="url(#webShadow)">
    <rect width="530" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Browser Top Bar -->
    <rect width="530" height="32" rx="12" fill="#f1f5f9" />
    <path d="M0 20 L530 20 L530 32 L0 32 Z" fill="#f1f5f9" />
    <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="16" r="4.5" fill="#f59e0b" />
    <circle cx="46" cy="16" r="4.5" fill="#10b981" />
    <!-- Address Bar -->
    <rect x="70" y="8" width="300" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="140" y="20" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">https://apexsolutions.demo/cloud</text>

    <!-- Webpage Content -->
    <!-- Nav -->
    <g transform="translate(20, 44)">
      <circle cx="8" cy="8" r="7" fill="url(#brandAccent)" />
      <text x="22" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#0f172a">APEX<tspan fill="#2563eb">.IO</tspan></text>
      <!-- Nav Links -->
      <text x="170" y="12" font-family="'Inter', sans-serif" font-size="8.5" fill="#334155" font-weight="500">Products</text>
      <text x="225" y="12" font-family="'Inter', sans-serif" font-size="8.5" fill="#334155" font-weight="500">Solutions</text>
      <text x="280" y="12" font-family="'Inter', sans-serif" font-size="8.5" fill="#334155" font-weight="500">Pricing</text>
      <text x="330" y="12" font-family="'Inter', sans-serif" font-size="8.5" fill="#334155" font-weight="500">Docs</text>
      <!-- CTA Button -->
      <rect x="400" y="0" width="85" height="20" rx="10" fill="#2563eb" />
      <text x="442" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Start Free Trial</text>
    </g>
    <line x1="0" y1="74" x2="530" y2="74" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Hero Content Inside Webpage -->
    <g transform="translate(24, 90)">
      <!-- Badge -->
      <rect width="140" height="18" rx="9" fill="#eff6ff" />
      <text x="70" y="12" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#2563eb">✨ Next-Gen Cloud Engine 3.0</text>
      
      <!-- Headline -->
      <text x="0" y="42" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Scale Cloud Infrastructure</text>
      <text x="0" y="66" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="url(#brandAccent)">With Zero Latency.</text>
      
      <!-- Subtext -->
      <text x="0" y="86" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Unified developer orchestration for global distributed microservices.</text>

      <!-- Buttons -->
      <rect x="0" y="100" width="90" height="26" rx="6" fill="#0f172a" />
      <text x="45" y="116" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Deploy Now</text>
      
      <rect x="100" y="100" width="85" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="142" y="116" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#334155">Live Demo</text>
    </g>

    <!-- Mini Dashboard Visual Inside Hero -->
    <g transform="translate(270, 95)">
      <rect width="235" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="10" y="10" width="95" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="18" y="24" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">System Throughput</text>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#0f172a">99.998%</text>
      
      <rect x="115" y="10" width="110" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="123" y="24" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Latency (Global Avg)</text>
      <text x="123" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#0284c7">4.2 ms</text>

      <!-- Mini Chart -->
      <g transform="translate(10, 62)">
        <rect width="215" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" />
        <path d="M15 50 Q45 25 75 40 T135 20 T195 12" stroke="#2563eb" stroke-width="2.5" fill="none" />
        <path d="M15 50 Q45 25 75 40 T135 20 T195 12 L195 60 L15 60 Z" fill="#38bdf8" fill-opacity="0.1" />
        <circle cx="195" cy="12" r="3.5" fill="#2563eb" />
      </g>
    </g>

    <!-- Features 3-Card Row at bottom of webpage -->
    <g transform="translate(20, 252)">
      <rect width="155" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Multi-Region Edge</text>
      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Instant automated replication across 45 continents.</text>

      <rect x="165" width="155" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="177" y="22" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Autonomous Scaling</text>
      <text x="177" y="38" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Auto-load balancing dynamically during traffic spikes.</text>

      <rect x="330" width="155" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="342" y="22" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">End-to-End Vault</text>
      <text x="342" y="38" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Hardware-enforced zero trust cryptography.</text>
    </g>
  </g>

  <!-- Mobile Smartphone Mockup (Right) -->
  <g transform="translate(590, 80)" filter="url(#webShadow)">
    <rect width="170" height="325" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="6" y="6" width="158" height="313" rx="18" fill="#ffffff" />
    <!-- Dynamic Island / Speaker -->
    <rect x="55" y="12" width="60" height="10" rx="5" fill="#0f172a" />
    <!-- Mobile Header -->
    <g transform="translate(16, 32)">
      <circle cx="6" cy="6" r="5" fill="#2563eb" />
      <text x="16" y="10" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#0f172a">APEX</text>
      <!-- Mobile Hamburger -->
      <line x1="126" y1="5" x2="138" y2="5" stroke="#0f172a" stroke-width="1.5" />
      <line x1="126" y1="9" x2="138" y2="9" stroke="#0f172a" stroke-width="1.5" />
    </g>
    <!-- Mobile Content -->
    <g transform="translate(16, 56)">
      <rect width="80" height="14" rx="7" fill="#eff6ff" />
      <text x="40" y="10" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#2563eb">Cloud 3.0</text>
      <text x="0" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#0f172a">Scale Cloud</text>
      <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#2563eb">Infrastructure</text>
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="6.5" fill="#64748b">Unified microservice orchestration.</text>
      
      <rect x="0" y="72" width="138" height="22" rx="5" fill="#2563eb" />
      <text x="69" y="86" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Get Started Free</text>

      <!-- Mobile Stat Card -->
      <rect x="0" y="106" width="138" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="122" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Active Nodes</text>
      <text x="10" y="140" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0f172a">14,280+</text>
      <text x="10" y="156" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#10b981">↑ 28% from last month</text>
    </g>
    <!-- Mobile Home Indicator -->
    <rect x="55" y="306" width="60" height="4" rx="2" fill="#0f172a" />
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(30, 420)">
    <rect width="740" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">CORE ARCHITECTURE &amp; TECH</text>
    <text x="20" y="42" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Responsive Grid • 100/100 Lighthouse Performance • WCAG AA Accessible • Semantic HTML5/CSS3/Vanilla JS</text>
    <g transform="translate(560, 16)">
      <rect width="76" height="26" rx="4" fill="#f1f5f9" />
      <text x="38" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#334155">Responsive</text>
      <rect x="84" width="86" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="127" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#1d4ed8">Live Demo View</text>
    </g>
  </g>
</svg>