<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="foodGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadowP1" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradP1)" />
  <rect width="798" height="498" x="1" y="1" rx="15" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Concept Label Ribbon -->
  <g transform="translate(30, 24)">
    <rect width="180" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="16" cy="14" r="4" fill="#2563eb" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">CONCEPT CAMPAIGN</text>
  </g>
  <text x="770" y="42" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b">5 Coordinated Social Visuals • "Savor &amp; Fire"</text>

  <!-- Post 1: Hero Dish (Square 1:1 format) -->
  <g transform="translate(40, 80)" filter="url(#shadowP1)">
    <rect width="210" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0" />
    <!-- Header -->
    <circle cx="24" cy="24" r="10" fill="#f97316" />
    <text x="42" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">@savorfire</text>
    <text x="42" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Artisan Grill</text>
    <!-- Visual Image Area -->
    <rect x="12" y="44" width="186" height="150" rx="8" fill="url(#foodGrad1)" />
    <!-- Illustrated Gourmet Burger/Dish -->
    <circle cx="105" cy="119" r="50" fill="#ffffff" fill-opacity="0.15" />
    <ellipse cx="105" cy="115" rx="36" ry="22" fill="#78350f" />
    <ellipse cx="105" cy="105" rx="34" ry="16" fill="#f59e0b" />
    <path d="M72 112 Q105 125 138 112" stroke="#22c55e" stroke-width="6" stroke-linecap="round" fill="none" />
    <ellipse cx="105" cy="100" rx="32" ry="12" fill="#fed7aa" />
    <!-- Badge -->
    <rect x="22" y="54" width="70" height="20" rx="10" fill="#ffffff" />
    <text x="57" y="68" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#ea580c">CHEF's PICK</text>
    <!-- Post Copy -->
    <text x="14" y="214" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Smoked Wagyu Brioche</text>
    <text x="14" y="228" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Slow-roasted oak wood &amp; truffle aioli.</text>
    <!-- CTA Button -->
    <rect x="14" y="238" width="182" height="22" rx="6" fill="#0f172a" />
    <text x="105" y="253" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#ffffff">Reserve Table &gt;</text>
  </g>

  <!-- Post 2: Promo 20% Off Weekend (Center Primary Card) -->
  <g transform="translate(275, 70)" filter="url(#shadowP1)">
    <rect width="250" height="320" rx="14" fill="url(#darkCard)" stroke="#334155" />
    <!-- Gold Trim Tag -->
    <rect x="20" y="20" width="85" height="22" rx="11" fill="url(#goldGrad)" />
    <text x="62" y="34" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff">WEEKEND SPECIAL</text>
    <text x="215" y="35" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">#SAVOR20</text>
    <!-- Typography Hero -->
    <text x="20" y="90" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">TASTE THE</text>
    <text x="20" y="122" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#f59e0b" letter-spacing="-0.5">FIRE CRAFT.</text>
    <text x="20" y="148" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Experience handcrafted fire-kissed dishes this Friday to Sunday.</text>
    <!-- Discount Visual Circle -->
    <g transform="translate(125, 215)">
      <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
      <text x="0" y="-4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#ffffff">20%</text>
      <text x="0" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f59e0b">OFF DINE-IN</text>
      <text x="0" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">CODE: FIRE20</text>
    </g>
    <!-- Footer CTA -->
    <rect x="20" y="278" width="210" height="28" rx="8" fill="#2563eb" />
    <text x="125" y="296" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Claim Voucher in Bio</text>
  </g>

  <!-- Post 3: Artisan Beverage Post (Right) -->
  <g transform="translate(550, 80)" filter="url(#shadowP1)">
    <rect width="210" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0" />
    <circle cx="24" cy="24" r="10" fill="#0284c7" />
    <text x="42" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">@savorfire</text>
    <text x="42" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Craft Cocktails</text>
    <!-- Image Box -->
    <rect x="12" y="44" width="186" height="150" rx="8" fill="#f1f5f9" />
    <!-- Glass Illustration -->
    <path d="M85 70 L125 70 L115 130 L95 130 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5" />
    <line x1="105" y1="130" x2="105" y2="165" stroke="#0284c7" stroke-width="2" />
    <ellipse cx="105" cy="165" rx="18" ry="4" fill="#0284c7" />
    <circle cx="120" cy="74" r="8" fill="#f59e0b" />
    <!-- Text -->
    <text x="14" y="214" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Smoked Rosemary Mule</text>
    <text x="14" y="228" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Handcrafted citrus infusion &amp; ginger ale.</text>
    <!-- Story Tag -->
    <rect x="14" y="238" width="182" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="105" y="253" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#0f172a">Happy Hours 5-8 PM</text>
  </g>

  <!-- Post 4 & 5 Mini-Strip Preview (Bottom bar showing campaign consistency) -->
  <g transform="translate(40, 410)">
    <rect width="720" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <text x="24" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f172a">CAMPAIGN SYSTEM DELIVERABLES</text>
    <text x="24" y="46" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">5 Cohesive Grid Posts • Color Palette: Burnt Orange, Obsidian &amp; Warm Amber • Custom Typography System</text>
    <!-- Post Pills -->
    <g transform="translate(490, 16)">
      <rect width="42" height="34" rx="4" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" />
      <text x="21" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ea580c">#01</text>
      
      <rect x="48" width="42" height="34" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" />
      <text x="69" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f59e0b">#02</text>
      
      <rect x="96" width="42" height="34" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" />
      <text x="117" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0284c7">#03</text>
      
      <rect x="144" width="42" height="34" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" />
      <text x="165" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981">#04</text>
      
      <rect x="192" width="42" height="34" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" />
      <text x="213" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#6366f1">#05</text>
    </g>
  </g>
</svg>